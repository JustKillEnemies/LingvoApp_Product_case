services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"  # хттп соединение
      - "9000:9000"  # прямое соединение
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./:/var/lib/clickhouse/user_files  // для csv

  superset:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY="secretsecret"
    volumes:
      - superset_data:/app/superset_home
    depends_on:
      - clickhouse

volumes:
  clickhouse_data:
  superset_data: